<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Scroll to Top</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 30px 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .content-area {
            height: 2500px; 
            background: linear-gradient(to bottom, #ecf0f1, #bdc3c7, #95a5a6, #7f8c8d);
            padding: 40px 20px;
            text-align: center;
            color: #333;
        }

        #btnTop {
            display: none;
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            z-index: 99;
            font-size: 30px;
            border: none;
            outline: none;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            padding: 15px 22px;
            border-radius: 50%;
            opacity: 0.5;
            transition: opacity 0.3s ease-in-out; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

            #btnTop:hover {
            opacity: 1; 
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <header id="topHeader">
        Top Page Header
    </header>

    <div class="content-area">
        <h2>Scroll ke bawah lebih dari 500px untuk memunculkan tombol</h2>
        <p>Tinggi area ini diatur sebesar 2500px agar halaman dapat di-scroll down beberapa kali.</p>
    </div>

    <button id="btnTop" title="Kembali ke Atas">&#8679;</button>

    <script>
        const myButton = document.getElementById("btnTop");

        window.onscroll = function() {
            scrollFunction();
        };

        function scrollFunction() {
            if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
                myButton.style.display = "block";
            } else {
                myButton.style.display = "none";
            }
        }

        myButton.addEventListener("click", function() {
            window.scrollTo({
                top: 0,
                behavior: "auto"
            });
        });
    </script>
</body>
</html>
